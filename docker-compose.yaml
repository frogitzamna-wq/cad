version: '3.8'

services:
  # Main CAD Application
  cad-app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: cad-app
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "9090:9090"
    environment:
      - NODE_ENV=production
      - BSV_NETWORK=${BSV_NETWORK:-mainnet}
      - BROADCAST_URL=${BROADCAST_URL:-https://api.whatsonchain.com/v1/bsv/main/tx/raw}
      - INDEXER_URL=${INDEXER_URL:-https://api.whatsonchain.com/v1/bsv/main}
      - UHRP_ENDPOINT=${UHRP_ENDPOINT:-https://uhrp.babbage.systems}
      - MESSAGEBOX_URL=${MESSAGEBOX_URL:-https://messagebox.babbage.systems}
      - DID_RESOLVER_URL=${DID_RESOLVER_URL:-https://identity.bsvblockchain.org}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - cad-data:/app/data
      - cad-logs:/app/logs
    networks:
      - cad-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - redis
      - postgres
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # SPV Indexer Service
  indexer:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: cad-indexer
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - SERVICE_MODE=indexer
      - BSV_NETWORK=${BSV_NETWORK:-mainnet}
      - INDEXER_URL=${INDEXER_URL:-https://api.whatsonchain.com/v1/bsv/main}
      - POLL_INTERVAL=${POLL_INTERVAL:-3000}
      - CHECKPOINT_INTERVAL=${CHECKPOINT_INTERVAL:-10}
    volumes:
      - indexer-data:/app/data
      - cad-logs:/app/logs
    networks:
      - cad-network
    depends_on:
      - postgres
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: cad-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-cad}
      - POSTGRES_USER=${POSTGRES_USER:-caduser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale=en_US.UTF-8
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - cad-network
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-caduser} -d ${POSTGRES_DB:-cad}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: cad-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-changeme}
    volumes:
      - redis-data:/data
    networks:
      - cad-network
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: cad-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - cad-network
    ports:
      - "9091:9090"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # Grafana Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: cad-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-changeme}
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
      - GF_SERVER_ROOT_URL=http://localhost:3001
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - cad-network
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: cad-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx-logs:/var/log/nginx
    networks:
      - cad-network
    depends_on:
      - cad-app
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

networks:
  cad-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16

volumes:
  cad-data:
    driver: local
  cad-logs:
    driver: local
  indexer-data:
    driver: local
  postgres-data:
    driver: local
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  nginx-logs:
    driver: local
